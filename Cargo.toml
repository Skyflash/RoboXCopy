[package]
name = "roboxcopy"
version = "0.1.1"
edition = "2024"
description = "Robo-XCopy: an Amiga X-Copy-style front end for Windows robocopy"
license = "MIT"

[[bin]]
name = "RoboXCopy"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[features]
# Dev-only: `--screenshot` support used to produce the images for the website.
screenshot = ["dep:image"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
