name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the "Planned" list in [CHANGELOG.md](https://github.com/Skyflash/RoboXCopy/blob/main/CHANGELOG.md) first: your idea may already be on it.
        For open-ended ideas and questions, [Discussions](https://github.com/Skyflash/RoboXCopy/discussions) is a better place.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or problem, in your own words.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Robo-XCopy help?
      description: The feature you have in mind. If it maps to a robocopy switch, name it.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: Workarounds you use today, screenshots, links.
